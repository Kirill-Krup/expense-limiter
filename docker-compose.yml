services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_limiter
      POSTGRES_USER: ${DB_USER:-expense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expense}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-readonly.sql:/docker-entrypoint-initdb.d/10-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_limiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/expense_limiter
      DB_USER: expense
      DB_PASSWORD: expense
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-demo}
    ports:
      - "8080:8080"

volumes:
  pgdata:
